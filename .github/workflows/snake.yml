name: Contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#f0f6fc&color_background=#00000000&color_dots=#151b23,#2e3270,#4348b0,#6366f1,#a5b4fc
            dist/snake-light.svg?color_snake=#1f2328&color_dots=#eff2f5,#c7d2fe,#a5b4fc,#6366f1,#4338ca

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
