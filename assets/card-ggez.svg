<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="ggez.gg. League of Legends stats, builds, tier lists and leaderboards, plus an AI coach. Fast, ad-free and no account needed.">
<style>
  :root{--fg:#1f2328;--muted:#59636e;--subtle:#818b98;--line:#d1d9e0;--card:#f6f8fa;--panel:#ffffff;--accent:#4f46e5;--ok:#1a7f37;
        --l0:#eff2f5;--l1:#c7d2fe;--l2:#a5b4fc;--l3:#6366f1;--l4:#4338ca;--paper:#ffffff}
  @media (prefers-color-scheme: dark){:root{--fg:#f0f6fc;--muted:#9198a1;--subtle:#6e7681;--line:#3d444d;--card:#151b23;--panel:#0d1117;--accent:#8b8cf8;--ok:#3fb950;
        --l0:#1b2130;--l1:#2e3270;--l2:#4348b0;--l3:#6366f1;--l4:#a5b4fc;--paper:#e9edf2}}
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
  .fg{fill:var(--fg)}.muted{fill:var(--muted)}.subtle{fill:var(--subtle)}.accent{fill:var(--accent)}.ok{fill:var(--ok)}
  .line{stroke:var(--line)}.card{fill:var(--card)}.panel{fill:var(--panel)}.paper{fill:var(--paper)}
  .l0{fill:var(--l0)}.l1{fill:var(--l1)}.l2{fill:var(--l2)}.l3{fill:var(--l3)}.l4{fill:var(--l4)}
  .in{opacity:0;animation:in .6s ease-out forwards}
  @keyframes in{to{opacity:1}}
  @keyframes wave{0%,100%{opacity:0}45%,55%{opacity:.95}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(150px)}100%{transform:translateY(0)}}
  @keyframes dash{to{stroke-dashoffset:-24}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .wave{opacity:0;animation:wave 4.2s ease-in-out infinite}
  .blink{animation:blink 1.1s step-end infinite}
  .scan{animation:scan 3.6s ease-in-out infinite}
  .flow{stroke-dasharray:6 6;animation:dash 1s linear infinite}
  .float{animation:float 3s ease-in-out infinite}
</style>
