t x="264" y="94" class="fg" font-size="15" >Mozzarella</text><circle cx="388" cy="89" r="4" fill="#f76b15"/><text x="400" y="94" class="muted" font-size="13" >use in 5 days</text></g><g class="in" style="animation-delay:0.70s"><text x="264" y="120" class="fg" font-size="15" >Tomatoes</text><circle cx="388" cy="115" r="4" fill="#30a46c"/><text x="400" y="120" class="muted" font-size="13" >use in 6 days</text></g><g class="in" style="animation-delay:0.85s"><text x="264" y="146" class="fg" font-size="15" >Spaghetti</text><circle cx="388" cy="141" r="4" fill="#818b98"/><text x="400" y="146" class="muted" font-size="13" >keeps for a year</text></g><line x1="264" y1="178" x2="536" y2="178" class="line"/><g class="in" style="animation-delay:1.1s"><text x="264" y="206" class="fg" font-size="16" font-weight="600">Spaghetti Caprese</text><circle cx="270" cy="222" r="4" class="ok"/><text x="282" y="227" class="ok" font-size="13" >cookable now</text></g></g>
<line x1="0" y1="295.5" x2="1200" y2="295.5" class="line"/>
</g>
