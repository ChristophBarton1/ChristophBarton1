y="70" class="fg" font-size="14" >Basil</text><rect x="420" y="56" width="84" height="20" rx="10" fill="#e5484d" fill-opacity=".15"/><text x="462" y="70" text-anchor="middle" class="mono" font-size="11" fill="#e5484d">2 days</text></g><g class="in" style="animation-delay:0.55s"><text x="268" y="94" class="fg" font-size="14" >Mozzarella</text><rect x="420" y="80" width="84" height="20" rx="10" fill="#f76b15" fill-opacity=".15"/><text x="462" y="94" text-anchor="middle" class="mono" font-size="11" fill="#f76b15">5 days</text></g><g class="in" style="animation-delay:0.70s"><text x="268" y="118" class="fg" font-size="14" >Tomatoes</text><rect x="420" y="104" width="84" height="20" rx="10" fill="#30a46c" fill-opacity=".15"/><text x="462" y="118" text-anchor="middle" class="mono" font-size="11" fill="#30a46c">6 days</text></g><g class="in" style="animation-delay:0.85s"><text x="268" y="142" class="fg" font-size="14" >Spaghetti</text><rect x="420" y="128" width="84" height="20" rx="10" fill="#818b98" fill-opacity=".15"/><text x="462" y="142" text-anchor="middle" class="mono" font-size="11" fill="#818b98">1 year</text></g><g class="in" style="animation-delay:1.1s"><rect x="252" y="182" width="268" height="62" rx="12" class="panel" stroke="#f76b15" stroke-opacity=".6"/><text x="268" y="208" class="fg" font-size="15" font-weight="600">Spaghetti Caprese</text><circle cx="274" cy="226" r="6" class="ok"/><text x="286" y="230" class="mono ok" font-size="11" letter-spacing="1.5">COOKABLE NOW</text></g></g>
</g>
</svg>
