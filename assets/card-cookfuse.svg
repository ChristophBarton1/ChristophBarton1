<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="CookFuse. Photograph a receipt, get a pantry. Groceries are recognised on the device, tracked by shelf life and turned into recipes before anything spoils.">
<style>
  :root{--fg:#1f2328;--muted:#59636e;--subtle:#818b98;--line:#d1d9e0;--card:#f6f8fa;--panel:#ffffff;--accent:#4f46e5;--ok:#1a7f37;
        --l0:#eff2f5;--l1:#c7d2fe;--l2:#a5b4fc;--l3:#6366f1;--l4:#4338ca;--paper:#ffffff}
  @media (prefers-color-scheme: dark){:root{--fg:#f0f6fc;--muted:#9198a1;--subtle:#6e7681;--line:#3d444d;--card:#151b23;--panel:#0d1117;--accent:#8b8cf8;--ok:#3fb950;
        --l0:#1b2130;--l1:#2e3270;--l2:#4348b0;--l3:#6366f1;--l4:#a5b4fc;--paper:#e9edf2}}
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
  .fg{fill:var(--fg)}.muted{fill:var(--muted)}.subtle{fill:var(--subtle)}.accent{fill:var(--accent)}.ok{fill:var(--ok)}
  .line{stroke:var(--line)}.card{fill:var(--card)}.panel{fill:var(--panel)}.paper{fill:var(--paper)}
  .l0{fill:var(--l0)}.l1{fill:var(--l1)}.l2{fill:var(--l2)}.l3{fill:var(--l3)}.l4{fill:var(--l4)}
  .in{opacity:0;animation:in .6s ease-out forwards}
  @keyframes in{to{opacity:1}}
  @keyframes wave{0%,100%{opacity:0}45%,55%{opacity:.95}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(150px)}100%{transform:translateY(0)}}
  @keyframes dash{to{stroke-dashoffset:-24}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .wave{opacity:0;animation:wave 4.2s ease-in-out infinite}
  .blink{animation:blink 1.1s step-end infinite}
  .scan{animation:scan 3.6s ease-in-out infinite}
  .flow{stroke-dasharray:6 6;animation:dash 1s linear infinite}
  .float{animation:float 3s ease-in-out infinite}
</style>
<g class="sans">
<rect x="0.5" y="0.5" width="1199" height="359" rx="16" class="card line"/><rect x="24" y="0" width="1152" height="3" rx="1.5" fill="#f76b15"/>
<text x="40" y="52" class="mono subtle" font-size="13" letter-spacing="1.5"><tspan fill="#f76b15" font-weight="700">02</tspan>   MOBILE APP</text><text x="600" y="52" text-anchor="end" class="mono subtle" font-size="13" letter-spacing="1.5">PRIVATE  <tspan fill="#f76b15" font-size="16">&#8599;</tspan></text>
<text x="38" y="116" class="fg" font-size="48" font-weight="650" letter-spacing="-1.5">CookFuse</text>
<text x="40" y="164" class="muted" font-size="20" >Photograph a receipt, get a pantry. Groceries are</text>
<text x="40" y="194" class="muted" font-size="20" >recognised on the device, tracked by shelf life</text>
<text x="40" y="224" class="muted" font-size="20" >and turned into recipes before anything spoils.</text>
<rect x="40" y="296" width="123" height="28" rx="14" fill="#f76b15" fill-opacity=".1" stroke="#f76b15" stroke-opacity=".35"/><text x="101" y="315" text-anchor="middle" class="mono fg" font-size="13">React Native</text><rect x="170.8" y="296" width="56" height="28" rx="14" fill="#f76b15" fill-opacity=".1" stroke="#f76b15" stroke-opacity=".35"/><text x="199" y="315" text-anchor="middle" class="mono fg" font-size="13">Expo</text><rect x="234.4" y="296" width="64" height="28" rx="14" fill="#f76b15" fill-opacity=".1" stroke="#f76b15" stroke-opacity=".35"/><text x="266" y="315" text-anchor="middle" class="mono fg" font-size="13">Astro</text><rect x="306.4" y="296" width="123" height="28" rx="14" fill="#f76b15" fill-opacity=".1" stroke="#f76b15" stroke-opacity=".35"/><text x="368" y="315" text-anchor="middle" class="mono fg" font-size="13">Workers + D1</text>
