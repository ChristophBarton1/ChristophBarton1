<text x="-2" y="100" class="fg" font-size="42" font-weight="650" letter-spacing="-1.5">STS2 Hub</text>
<text x="0" y="144" class="muted" font-size="19" >Fan-made Slay the Spire 2 hub with a deck</text>
<text x="0" y="173" class="muted" font-size="19" >builder, card database, community tier votes</text>
<text x="0" y="202" class="muted" font-size="19" >and guides in nine languages.</text>
<text x="0" y="250" class="subtle" font-size="15" >SvelteKit, Turso, Tailwind, Cloudflare</text>
