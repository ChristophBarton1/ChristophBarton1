<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-label="STS2 Hub: Fan-made Slay the Spire 2 hub: deck builder with shareable codes, card database, community tier votes and guides in nine languages.">
<style>
  :root{--fg:#1f2328;--muted:#59636e;--subtle:#818b98;--line:#d1d9e0;--card:#f6f8fa;--accent:#4f46e5;--ok:#1a7f37}
  @media (prefers-color-scheme: dark){:root{--fg:#f0f6fc;--muted:#9198a1;--subtle:#6e7681;--line:#3d444d;--card:#151b23;--accent:#8b8cf8;--ok:#3fb950}}
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
  .fg{fill:var(--fg)}.muted{fill:var(--muted)}.subtle{fill:var(--subtle)}.accent{fill:var(--accent)}.ok{fill:var(--ok)}
  .line{stroke:var(--line)}.card{fill:var(--card)}
  .in{opacity:0;animation:in .7s ease-out forwards}
  @keyframes in{to{opacity:1}}
</style>
<g class="sans">
  <rect x="0.5" y="0.5" width="599" height="279" rx="14" class="card line" stroke-width="1"/>
  <text x="32" y="48" class="mono subtle" font-size="14" letter-spacing="1.5"><tspan class="accent">06</tspan>   WEB APP</text>
  <text x="568" y="48" text-anchor="end" class="mono subtle" font-size="13" letter-spacing="1.5">OPEN SOURCE  <tspan class="accent" font-size="16">&#8599;</tspan></text>
  <text x="31" y="108" class="fg" font-size="34" font-weight="650" letter-spacing="-1">STS2 Hub</text>
  <text x="32" y="150" class="muted" font-size="19">Fan-made Slay the Spire 2 hub: deck builder with</text>
  <text x="32" y="178" class="muted" font-size="19">shareable codes, card database, community tier</text>
  <text x="32" y="206" class="muted" font-size="19">votes and guides in nine languages.</text>
  <line x1="32" y1="226" x2="568" y2="226" class="line" stroke-width="1"/>
  <text x="32" y="256" class="mono subtle" font-size="14">SvelteKit / Turso / Tailwind / Cloudflare</text>
</g>
</svg>
