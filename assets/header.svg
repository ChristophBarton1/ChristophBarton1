<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Christoph Barton — Full-Stack Web Developer &amp; Front-End Specialist">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="1" stop-color="#0c1226"/>
    </linearGradient>
    <radialGradient id="orbA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#06b6d4" stop-opacity=".40"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d946ef" stop-opacity=".28"/>
      <stop offset="1" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#c7d2fe"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset=".5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity=".15"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <radialGradient id="gridFade" cx="35%" cy="45%" r="75%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1200" height="400" fill="url(#gridFade)"/></mask>
    <clipPath id="frame"><rect width="1200" height="400" rx="22"/></clipPath>
    <style>
      .sans{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
      .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace}
      .rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
      .l{opacity:0;animation:fade .35s ease forwards}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
      @keyframes fade{to{opacity:1}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes pulse{0%{r:5;opacity:.7}100%{r:13;opacity:0}}
      .cursor{animation:blink 1s step-end infinite}
      .ping{animation:pulse 1.8s ease-out infinite}
      .k{fill:#c084fc}.p{fill:#7dd3fc}.s{fill:#86efac}.c{fill:#94a3b8}.t{fill:#e2e8f0}.dim{fill:#64748b}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#bg)"/>

    <!-- drifting glow orbs -->
    <circle cx="180" cy="80" r="260" fill="url(#orbA)">
      <animateTransform attributeName="transform" type="translate" values="0 0;60 40;0 0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="330" r="280" fill="url(#orbB)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-70 -30;0 0" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="420" r="220" fill="url(#orbC)">
      <animateTransform attributeName="transform" type="translate" values="0 0;40 -50;0 0" dur="18s" repeatCount="indefinite"/>
    </circle>

    <rect width="1200" height="400" fill="url(#grid)" mask="url(#gridMask)"/>

    <!-- left: intro -->
    <g class="sans">
      <text x="64" y="112" class="mono rise" font-size="14" letter-spacing="4" fill="#818cf8" style="animation-delay:.1s">HI, I'M</text>
      <text x="62" y="178" font-size="60" font-weight="800" fill="url(#name)" letter-spacing="-1" class="rise" style="animation-delay:.25s">Christoph Barton</text>
      <text x="64" y="222" font-size="21" font-weight="600" fill="#e2e8f0" class="rise" style="animation-delay:.45s">Full-Stack Web Developer &amp; Front-End Specialist</text>
      <text x="64" y="254" font-size="16" fill="#94a3b8" class="rise" style="animation-delay:.6s">I design and ship fast, polished web products — with a touch of AI.</text>

      <!-- stack pills -->
      <g class="rise" style="animation-delay:.8s" font-size="13" font-weight="600">
        <rect x="64"  y="280" width="92"  height="30" rx="15" fill="#ff3e00" fill-opacity=".12" stroke="#ff3e00" stroke-opacity=".45"/>
        <text x="110" y="300" text-anchor="middle" fill="#ffb199">SvelteKit</text>
        <rect x="166" y="280" width="68"  height="30" rx="15" fill="#00dc82" fill-opacity=".12" stroke="#00dc82" stroke-opacity=".45"/>
        <text x="200" y="300" text-anchor="middle" fill="#8ff0c4">Nuxt</text>
        <rect x="244" y="280" width="78"  height="30" rx="15" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".35"/>
        <text x="283" y="300" text-anchor="middle" fill="#f1f5f9">Next.js</text>
        <rect x="332" y="280" width="104" height="30" rx="15" fill="#3178c6" fill-opacity=".16" stroke="#3178c6" stroke-opacity=".6"/>
        <text x="384" y="300" text-anchor="middle" fill="#9ec5f5">TypeScript</text>
        <rect x="446" y="280" width="118" height="30" rx="15" fill="#61dafb" fill-opacity=".10" stroke="#61dafb" stroke-opacity=".45"/>
        <text x="505" y="300" text-anchor="middle" fill="#a5ecfd">React Native</text>
        <rect x="574" y="280" width="54"  height="30" rx="15" fill="#c084fc" fill-opacity=".14" stroke="#c084fc" stroke-opacity=".55"/>
        <text x="601" y="300" text-anchor="middle" fill="#e2c6fe">AI</text>
      </g>

      <!-- availability -->
      <g class="rise" style="animation-delay:1s">
        <circle cx="74" cy="346" r="5" fill="#22c55e" class="ping"/>
        <circle cx="74" cy="346" r="5" fill="#22c55e"/>
        <text x="90" y="351" font-size="14" fill="#cbd5e1">Open to new opportunities  ·  Vienna, Austria</text>
      </g>
    </g>

    <!-- right: code card -->
    <g class="rise" style="animation-delay:.5s">
      <rect x="712" y="64" width="436" height="272" rx="16" fill="#0b1224" fill-opacity=".82" stroke="url(#cardStroke)"/>
      <rect x="712" y="64" width="436" height="40" rx="16" fill="#ffffff" fill-opacity=".03"/>
      <circle cx="736" cy="84" r="6" fill="#ff5f57"/>
      <circle cx="756" cy="84" r="6" fill="#febc2e"/>
      <circle cx="776" cy="84" r="6" fill="#28c840"/>
      <text x="930" y="89" text-anchor="middle" class="mono dim" font-size="12">christoph.ts</text>

      <g class="mono" font-size="15">
        <text x="736" y="136" class="l" style="animation-delay:1.0s"><tspan class="k">const</tspan><tspan class="t"> christoph </tspan><tspan class="c">= {</tspan></text>
        <text x="756" y="164" class="l" style="animation-delay:1.35s"><tspan class="p">role</tspan><tspan class="c">: </tspan><tspan class="s">"Full-Stack Developer"</tspan><tspan class="c">,</tspan></text>
        <text x="756" y="192" class="l" style="animation-delay:1.7s"><tspan class="p">based</tspan><tspan class="c">: </tspan><tspan class="s">"Vienna, AT"</tspan><tspan class="c">,</tspan></text>
        <text x="756" y="220" class="l" style="animation-delay:2.05s"><tspan class="p">ships</tspan><tspan class="c">: [</tspan><tspan class="s">"web"</tspan><tspan class="c">, </tspan><tspan class="s">"mobile"</tspan><tspan class="c">, </tspan><tspan class="s">"AI"</tspan><tspan class="c">],</tspan></text>
        <text x="756" y="248" class="l" style="animation-delay:2.4s"><tspan class="p">building</tspan><tspan class="c">: </tspan><tspan class="s">"ggez.gg"</tspan><tspan class="c">,</tspan></text>
        <text x="756" y="276" class="l" style="animation-delay:2.75s"><tspan class="p">coffee</tspan><tspan class="c">: </tspan><tspan class="k">Infinity</tspan><tspan class="c">,</tspan></text>
        <text x="736" y="304" class="l" style="animation-delay:3.1s"><tspan class="c">};</tspan></text>
        <rect x="760" y="291" width="9" height="17" fill="#818cf8" class="cursor"/>
      </g>
    </g>

    <!-- bottom accent line -->
    <rect x="0" y="396" width="1200" height="4" fill="url(#line)"/>
  </g>
</svg>
