<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Christoph Barton. Full-stack web developer with a focus on the front end. Vienna, Austria.">
<style>
  :root{--fg:#1f2328;--muted:#59636e;--subtle:#818b98;--line:#d1d9e0;--card:#f6f8fa;--accent:#4f46e5;--ok:#1a7f37}
  @media (prefers-color-scheme: dark){:root{--fg:#f0f6fc;--muted:#9198a1;--subtle:#6e7681;--line:#3d444d;--card:#151b23;--accent:#8b8cf8;--ok:#3fb950}}
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
  .fg{fill:var(--fg)}.muted{fill:var(--muted)}.subtle{fill:var(--subtle)}.accent{fill:var(--accent)}.ok{fill:var(--ok)}
  .line{stroke:var(--line)}.card{fill:var(--card)}
  .in{opacity:0;animation:in .7s ease-out forwards}
  @keyframes in{to{opacity:1}}
</style>
<g class="sans">
  <text x="0" y="28" class="mono subtle" font-size="14" letter-spacing="2">VIENNA, AUSTRIA</text>
  <circle cx="1002" cy="23" r="5" class="ok"/>
  <text x="1200" y="28" text-anchor="end" class="mono subtle" font-size="14" letter-spacing="2">AVAILABLE FOR WORK</text>
  <line x1="0" y1="52" x2="1200" y2="52" class="line" stroke-width="1"/>
  <g class="in" style="animation-delay:.05s">
    <text x="-4" y="150" class="fg" font-size="78" font-weight="650" letter-spacing="-3">Christoph Barton<tspan class="accent">.</tspan></text>
  </g>
  <g class="in" style="animation-delay:.2s">
    <text x="0" y="200" class="muted" font-size="28">Full-stack web developer with a focus on the front end.</text>
  </g>
  <line x1="0" y1="240" x2="1200" y2="240" class="line" stroke-width="1"/>
  <g class="in" style="animation-delay:.35s">
    <text x="0" y="274" class="mono subtle" font-size="13" letter-spacing="2">FOCUS</text>
    <text x="0" y="302" class="fg" font-size="19">Front-end, UI/UX, product</text>
    <text x="330" y="274" class="mono subtle" font-size="13" letter-spacing="2">STACK</text>
    <text x="330" y="302" class="fg" font-size="19">SvelteKit, Nuxt, Next.js, React Native</text>
    <text x="760" y="274" class="mono subtle" font-size="13" letter-spacing="2">NOW</text>
    <text x="760" y="302" class="fg" font-size="19">Building ggez.gg</text>
  </g>
</g>
</svg>
