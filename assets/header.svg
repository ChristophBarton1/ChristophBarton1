<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="336" viewBox="0 0 1200 336" role="img" aria-label="Christoph Barton, full-stack developer in Vienna. I build web products that feel finished. Building ggez.gg, shipping CookFuse, open to new roles. Available for work.">
<style>
  :root{--fg:#1f2328;--muted:#59636e;--subtle:#818b98;--line:#d8dee4;--card:#f3f5f7;--panel:#ffffff;--accent:#4f46e5;--ok:#1a7f37;
        --l0:#eaeef2;--l1:#c7d2fe;--l2:#a5b4fc;--l3:#6366f1;--l4:#4338ca;--paper:#ffffff}
  @media (prefers-color-scheme: dark){:root{--fg:#f0f6fc;--muted:#9198a1;--subtle:#6e7681;--line:#30363d;--card:#161b22;--panel:#0d1117;--accent:#8b8cf8;--ok:#3fb950;
        --l0:#1b2130;--l1:#2e3270;--l2:#4348b0;--l3:#6366f1;--l4:#a5b4fc;--paper:#e9edf2}}
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
  .fg{fill:var(--fg)}.muted{fill:var(--muted)}.subtle{fill:var(--subtle)}.accent{fill:var(--accent)}.ok{fill:var(--ok)}
  .line{stroke:var(--line)}.card{fill:var(--card)}.panel{fill:var(--panel)}.paper{fill:var(--paper)}
  .l0{fill:var(--l0)}.l1{fill:var(--l1)}.l2{fill:var(--l2)}.l3{fill:var(--l3)}.l4{fill:var(--l4)}
  .in{opacity:0;animation:in .6s ease-out forwards}
  @keyframes in{to{opacity:1}}
  @keyframes wave{0%,100%{opacity:0}45%,55%{opacity:.9}}
  @keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(140px)}100%{transform:translateY(0)}}
  @keyframes dash{to{stroke-dashoffset:-24}}
  .wave{opacity:0;animation:wave 4.2s ease-in-out infinite}
  .scan{animation:scan 3.6s ease-in-out infinite}
  .flow{stroke-dasharray:6 6;animation:dash 1s linear infinite}
</style>
<g class="sans">
<style>
      .word{opacity:0;animation:word 9s ease-in-out infinite}
      .w0{opacity:1}
      @keyframes word{0%{opacity:0}5%{opacity:1}29%{opacity:1}34%,100%{opacity:0}}
    </style>
<g class="in" style="animation-delay:.05s"><text x="0" y="34" font-size="20"><tspan class="fg" font-weight="700">Christoph Barton</tspan><tspan class="muted">   Full-stack developer in Vienna</tspan></text></g>
<g class="in" style="animation-delay:.15s"><text x="-4" y="140" class="fg" font-size="86" font-weight="700" letter-spacing="-3.2">I build web products</text></g>
<g class="in" style="animation-delay:.25s"><text x="-4" y="236" class="fg" font-size="86" font-weight="700" letter-spacing="-3.2">that feel </text>
<text x="-4" y="236" font-size="86" font-weight="700" letter-spacing="-3.2" class="word w0" style="animation-delay:0s"><tspan fill-opacity="0">that feel </tspan><tspan class="accent">finished.</tspan></text>
<text x="-4" y="236" font-size="86" font-weight="700" letter-spacing="-3.2" class="word w1" style="animation-delay:3s"><tspan fill-opacity="0">that feel </tspan><tspan class="accent">fast.</tspan></text>
<text x="-4" y="236" font-size="86" font-weight="700" letter-spacing="-3.2" class="word w2" style="animation-delay:6s"><tspan fill-opacity="0">that feel </tspan><tspan class="accent">effortless.</tspan></text>
</g>
<g class="in" style="animation-delay:.35s"><text x="0" y="286" class="muted" font-size="21" >Front end first: interfaces, design systems and the details people notice.</text></g>
<line x1="872" y1="18" x2="872" y2="318" class="line"/>
<g class="in" style="animation-delay:.3s"><circle cx="917" cy="29" r="5" class="ok"/><text x="930" y="35" class="fg" font-size="17" font-weight="600">Available for work</text></g>
<g class="in" style="animation-delay:0.40s"><text x="912" y="86" class="subtle" font-size="15" >Building</text><text x="912" y="113" class="fg" font-size="22" font-weight="700" letter-spacing="-0.4">ggez.gg</text><text x="912" y="136" class="muted" font-size="15" >LoL stats and an AI coach</text></g>
<g class="in" style="animation-delay:0.50s"><text x="912" y="174" class="subtle" font-size="15" >Shipping</text><text x="912" y="201" class="fg" font-size="22" font-weight="700" letter-spacing="-0.4">CookFuse</text><text x="912" y="224" class="muted" font-size="15" >From grocery receipt to recipe</text></g>
<g class="in" style="animation-delay:0.60s"><text x="912" y="262" class="subtle" font-size="15" >Open to</text><text x="912" y="289" class="fg" font-size="22" font-weight="700" letter-spacing="-0.4">New roles</text><text x="912" y="312" class="muted" font-size="15" >Full-time or freelance</text></g>
</g>
</svg>
