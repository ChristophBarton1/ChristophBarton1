<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-label="PromptShelf. Save prompts, turn them into mini-tools with variables and share packs with your team.">
<style>
  :root{--fg:#1f2328;--muted:#59636e;--subtle:#818b98;--line:#d1d9e0;--card:#f6f8fa;--panel:#ffffff;--accent:#4f46e5;--ok:#1a7f37;
        --l0:#eff2f5;--l1:#c7d2fe;--l2:#a5b4fc;--l3:#6366f1;--l4:#4338ca;--paper:#ffffff}
  @media (prefers-color-scheme: dark){:root{--fg:#f0f6fc;--muted:#9198a1;--subtle:#6e7681;--line:#3d444d;--card:#151b23;--panel:#0d1117;--accent:#8b8cf8;--ok:#3fb950;
        --l0:#1b2130;--l1:#2e3270;--l2:#4348b0;--l3:#6366f1;--l4:#a5b4fc;--paper:#e9edf2}}
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
  .fg{fill:var(--fg)}.muted{fill:var(--muted)}.subtle{fill:var(--subtle)}.accent{fill:var(--accent)}.ok{fill:var(--ok)}
  .line{stroke:var(--line)}.card{fill:var(--card)}.panel{fill:var(--panel)}.paper{fill:var(--paper)}
  .l0{fill:var(--l0)}.l1{fill:var(--l1)}.l2{fill:var(--l2)}.l3{fill:var(--l3)}.l4{fill:var(--l4)}
  .in{opacity:0;animation:in .6s ease-out forwards}
  @keyframes in{to{opacity:1}}
  @keyframes wave{0%,100%{opacity:0}45%,55%{opacity:.95}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(150px)}100%{transform:translateY(0)}}
  @keyframes dash{to{stroke-dashoffset:-24}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .wave{opacity:0;animation:wave 4.2s ease-in-out infinite}
  .blink{animation:blink 1.1s step-end infinite}
  .scan{animation:scan 3.6s ease-in-out infinite}
  .flow{stroke-dasharray:6 6;animation:dash 1s linear infinite}
  .float{animation:float 3s ease-in-out infinite}
</style>
<g class="sans">
<rect x="0.5" y="0.5" width="599" height="339" rx="16" class="card line"/><rect x="24" y="0" width="552" height="3" rx="1.5" fill="#3e63dd"/>
<g transform="translate(24,24)"><rect width="552" height="124" rx="12" class="panel line"/><g class="float" style="animation-delay:0.0s"><rect x="20" y="16" width="164" height="80" rx="10" class="card line"/><rect x="32" y="16" width="140" height="3" rx="1.5" fill="#3e63dd"/><text x="32" y="44" class="fg" font-size="12.5">Summarize <tspan fill="#12a594" font-weight="600">{topic}</tspan></text><text x="32" y="64" class="fg" font-size="12.5">for <tspan fill="#12a594" font-weight="600">{audience}</tspan></text><text x="32" y="84" class="mono subtle" font-size="9" letter-spacing="1.5">MINI-TOOL</text></g><g class="float" style="animation-delay:0.5s"><rect x="198" y="16" width="164" height="80" rx="10" class="card line"/><rect x="210" y="16" width="140" height="3" rx="1.5" fill="#3e63dd"/><text x="210" y="44" class="fg" font-size="12.5">Write a <tspan fill="#12a594" font-weight="600">{tone}</tspan></text><text x="210" y="64" class="fg" font-size="12.5">reply to <tspan fill="#12a594" font-weight="600">{email}</tspan></text><text x="210" y="84" class="mono subtle" font-size="9" letter-spacing="1.5">MINI-TOOL</text></g><g class="float" style="animation-delay:1.0s"><rect x="376" y="16" width="164" height="80" rx="10" class="card line"/><rect x="388" y="16" width="140" height="3" rx="1.5" fill="#3e63dd"/><text x="388" y="44" class="fg" font-size="12.5">Review this <tspan fill="#12a594" font-weight="600">{code}</tspan></text><text x="388" y="64" class="fg" font-size="12.5">for <tspan fill="#12a594" font-weight="600">{issues}</tspan></text><text x="388" y="84" class="mono subtle" font-size="9" letter-spacing="1.5">MINI-TOOL</text></g><rect x="12" y="104" width="528" height="6" rx="3" fill="#3e63dd" fill-opacity=".35"/></g>
<text x="32" y="186" class="mono subtle" font-size="13" letter-spacing="1.5"><tspan fill="#3e63dd" font-weight="700">03</tspan>   SAAS</text><text x="568" y="186" text-anchor="end" class="mono subtle" font-size="13" letter-spacing="1.5">PRIVATE  <tspan fill="#3e63dd" font-size="16">&#8599;</tspan></text>
<text x="31" y="224" class="fg" font-size="30" font-weight="650" letter-spacing="-1">PromptShelf</text>
<text x="32" y="256" class="muted" font-size="16.5" >Save prompts, turn them into mini-tools with</text>
<text x="32" y="280" class="muted" font-size="16.5" >variables and share packs with your team.</text>
<text x="32" y="316" class="mono subtle" font-size="12.5" >SvelteKit  /  Tailwind  /  Cloudflare D1  /  Drizzle</text>
</g>
</svg>
