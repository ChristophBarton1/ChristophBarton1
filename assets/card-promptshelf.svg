<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="296" viewBox="0 0 1200 296" role="img" aria-label="PromptShelf. SaaS  ·  Private repository. A home for reusable prompts. Save them, turn them into mini-tools with variables and share packs with your team.">
<style>
  :root{--fg:#1f2328;--muted:#59636e;--subtle:#818b98;--line:#d8dee4;--card:#f3f5f7;--panel:#ffffff;--accent:#4f46e5;--ok:#1a7f37;
        --l0:#eaeef2;--l1:#c7d2fe;--l2:#a5b4fc;--l3:#6366f1;--l4:#4338ca;--paper:#ffffff}
  @media (prefers-color-scheme: dark){:root{--fg:#f0f6fc;--muted:#9198a1;--subtle:#6e7681;--line:#30363d;--card:#161b22;--panel:#0d1117;--accent:#8b8cf8;--ok:#3fb950;
        --l0:#1b2130;--l1:#2e3270;--l2:#4348b0;--l3:#6366f1;--l4:#a5b4fc;--paper:#e9edf2}}
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
  .fg{fill:var(--fg)}.muted{fill:var(--muted)}.subtle{fill:var(--subtle)}.accent{fill:var(--accent)}.ok{fill:var(--ok)}
  .line{stroke:var(--line)}.card{fill:var(--card)}.panel{fill:var(--panel)}.paper{fill:var(--paper)}
  .l0{fill:var(--l0)}.l1{fill:var(--l1)}.l2{fill:var(--l2)}.l3{fill:var(--l3)}.l4{fill:var(--l4)}
  .in{opacity:0;animation:in .6s ease-out forwards}
  @keyframes in{to{opacity:1}}
  @keyframes wave{0%,100%{opacity:0}45%,55%{opacity:.9}}
  @keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(140px)}100%{transform:translateY(0)}}
  @keyframes dash{to{stroke-dashoffset:-24}}
  .wave{opacity:0;animation:wave 4.2s ease-in-out infinite}
  .scan{animation:scan 3.6s ease-in-out infinite}
  .flow{stroke-dasharray:6 6;animation:dash 1s linear infinite}
</style>
<g class="sans">
<text x="0" y="44" class="muted" font-size="15" >SaaS  ·  Private repository</text>
<text x="-2" y="100" class="fg" font-size="42" font-weight="650" letter-spacing="-1.5">PromptShelf</text>
<text x="0" y="144" class="muted" font-size="19" >A home for reusable prompts. Save them, turn</text>
<text x="0" y="173" class="muted" font-size="19" >them into mini-tools with variables and share</text>
<text x="0" y="202" class="muted" font-size="19" >packs with your team.</text>
<text x="0" y="250" class="subtle" font-size="15" >SvelteKit, Tailwind, Cloudflare D1, Drizzle</text>
<g transform="translate(640,24)"><rect width="560" height="236" rx="12" class="card"/><g class="in" style="animation-delay:0.20s"><rect x="24" y="36" width="160" height="104" rx="10" class="panel"/><text x="38" y="68" class="fg" font-size="13">Summarize <tspan fill="#12a594" font-weight="600">{topic}</tspan></text><text x="38" y="90" class="fg" font-size="13">for <tspan fill="#12a594" font-weight="600">{audience}</tspan></text><text x="38" y="122" class="subtle" font-size="12" >Mini-tool</text></g><g class="in" style="animation-delay:0.40s"><rect x="200" y="54" width="160" height="104" rx="10" class="panel"/><text x="214" y="86" class="fg" font-size="13">Write a <tspan fill="#12a594" font-weight="600">{tone}</tspan></text><text x="214" y="108" class="fg" font-size="13">reply to <tspan fill="#12a594" font-weight="600">{email}</tspan></text><text x="214" y="140" class="subtle" font-size="12" >Mini-tool</text></g><g class="in" style="animation-delay:0.60s"><rect x="376" y="36" width="160" height="104" rx="10" class="panel"/><text x="390" y="68" class="fg" font-size="13">Review this <tspan fill="#12a594" font-weight="600">{code}</tspan></text><text x="390" y="90" class="fg" font-size="13">for <tspan fill="#12a594" font-weight="600">{issues}</tspan></text><text x="390" y="122" class="subtle" font-size="12" >Mini-tool</text></g><line x1="24" y1="190" x2="536" y2="190" class="line" stroke-width="2"/><text x="24" y="218" class="muted" font-size="14" >Folders, packs and team sharing</text></g>
<line x1="0" y1="295.5" x2="1200" y2="295.5" class="line"/>
</g>
</svg>
