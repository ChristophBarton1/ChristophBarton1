<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="296" viewBox="0 0 1200 296" role="img" aria-label="Context Grabber. Browser extension  ·  Open source. One-click bug reports for AI-built apps. Captures errors, failed requests and the selected element and sends them to the chat.">
<style>
  :root{--fg:#1f2328;--muted:#59636e;--subtle:#818b98;--line:#d8dee4;--card:#f3f5f7;--panel:#ffffff;--accent:#4f46e5;--ok:#1a7f37;
        --l0:#eaeef2;--l1:#c7d2fe;--l2:#a5b4fc;--l3:#6366f1;--l4:#4338ca;--paper:#ffffff}
  @media (prefers-color-scheme: dark){:root{--fg:#f0f6fc;--muted:#9198a1;--subtle:#6e7681;--line:#30363d;--card:#161b22;--panel:#0d1117;--accent:#8b8cf8;--ok:#3fb950;
        --l0:#1b2130;--l1:#2e3270;--l2:#4348b0;--l3:#6366f1;--l4:#a5b4fc;--paper:#e9edf2}}
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
  .fg{fill:var(--fg)}.muted{fill:var(--muted)}.subtle{fill:var(--subtle)}.accent{fill:var(--accent)}.ok{fill:var(--ok)}
  .line{stroke:var(--line)}.card{fill:var(--card)}.panel{fill:var(--panel)}.paper{fill:var(--paper)}
  .l0{fill:var(--l0)}.l1{fill:var(--l1)}.l2{fill:var(--l2)}.l3{fill:var(--l3)}.l4{fill:var(--l4)}
  .in{opacity:0;animation:in .6s ease-out forwards}
  @keyframes in{to{opacity:1}}
  @keyframes wave{0%,100%{opacity:0}45%,55%{opacity:.9}}
  @keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(140px)}100%{transform:translateY(0)}}
  @keyframes dash{to{stroke-dashoffset:-24}}
  .wave{opacity:0;animation:wave 4.2s ease-in-out infinite}
  .scan{animation:scan 3.6s ease-in-out infinite}
  .flow{stroke-dasharray:6 6;animation:dash 1s linear infinite}
</style>
<g class="sans">
<text x="0" y="44" class="muted" font-size="15" >Browser extension  ·  Open source</text>
<text x="-2" y="100" class="fg" font-size="42" font-weight="650" letter-spacing="-1.5">Context Grabber</text>
<text x="0" y="144" class="muted" font-size="19" >One-click bug reports for AI-built apps.</text>
<text x="0" y="173" class="muted" font-size="19" >Captures errors, failed requests and the</text>
<text x="0" y="202" class="muted" font-size="19" >selected element and sends them to the chat.</text>
<text x="0" y="250" class="subtle" font-size="15" >WXT, Svelte 5, TypeScript, Tailwind</text>
<g transform="translate(640,24)"><rect width="560" height="236" rx="12" class="card"/><rect x="20" y="20" width="520" height="196" rx="10" class="panel"/><circle cx="38" cy="38" r="4.5" fill="#ff5f57"/><circle cx="54" cy="38" r="4.5" fill="#febc2e"/><circle cx="70" cy="38" r="4.5" fill="#28c840"/><text x="88" y="43" class="subtle" font-size="12" >Console</text><line x1="20" y1="56" x2="540" y2="56" class="line"/><g class="in" style="animation-delay:0.20s"><circle cx="40" cy="82" r="3.5" fill="#e5484d"/><text x="54" y="86" class="mono" font-size="13" fill="var(--fg)" >TypeError: cart.items is undefined</text></g><g class="in" style="animation-delay:0.45s"><circle cx="40" cy="108" r="3.5" fill="#e5484d"/><text x="54" y="112" class="mono" font-size="13" fill="var(--fg)" >POST /api/checkout  500</text></g><g class="in" style="animation-delay:0.70s"><circle cx="40" cy="134" r="3.5" fill="#818b98"/><text x="54" y="138" class="mono" font-size="13" fill="var(--fg)" >Selected: button.checkout</text></g><g class="in" style="animation-delay:1s"><rect x="372" y="170" width="152" height="32" rx="8" fill="#0090ff"/><text x="448" y="191" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Send to AI chat</text></g></g>
<line x1="0" y1="295.5" x2="1200" y2="295.5" class="line"/>
</g>
</svg>
