<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-label="Context Grabber. One-click bug reports for AI-built apps, sent straight into the chat that wrote the code.">
<style>
  :root{--fg:#1f2328;--muted:#59636e;--subtle:#818b98;--line:#d1d9e0;--card:#f6f8fa;--panel:#ffffff;--accent:#4f46e5;--ok:#1a7f37;
        --l0:#eff2f5;--l1:#c7d2fe;--l2:#a5b4fc;--l3:#6366f1;--l4:#4338ca;--paper:#ffffff}
  @media (prefers-color-scheme: dark){:root{--fg:#f0f6fc;--muted:#9198a1;--subtle:#6e7681;--line:#3d444d;--card:#151b23;--panel:#0d1117;--accent:#8b8cf8;--ok:#3fb950;
        --l0:#1b2130;--l1:#2e3270;--l2:#4348b0;--l3:#6366f1;--l4:#a5b4fc;--paper:#e9edf2}}
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
  .fg{fill:var(--fg)}.muted{fill:var(--muted)}.subtle{fill:var(--subtle)}.accent{fill:var(--accent)}.ok{fill:var(--ok)}
  .line{stroke:var(--line)}.card{fill:var(--card)}.panel{fill:var(--panel)}.paper{fill:var(--paper)}
  .l0{fill:var(--l0)}.l1{fill:var(--l1)}.l2{fill:var(--l2)}.l3{fill:var(--l3)}.l4{fill:var(--l4)}
  .in{opacity:0;animation:in .6s ease-out forwards}
  @keyframes in{to{opacity:1}}
  @keyframes wave{0%,100%{opacity:0}45%,55%{opacity:.95}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(150px)}100%{transform:translateY(0)}}
  @keyframes dash{to{stroke-dashoffset:-24}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .wave{opacity:0;animation:wave 4.2s ease-in-out infinite}
  .blink{animation:blink 1.1s step-end infinite}
  .scan{animation:scan 3.6s ease-in-out infinite}
  .flow{stroke-dasharray:6 6;animation:dash 1s linear infinite}
  .float{animation:float 3s ease-in-out infinite}
</style>
<g class="sans">
<rect x="0.5" y="0.5" width="599" height="339" rx="16" class="card line"/><rect x="24" y="0" width="552" height="3" rx="1.5" fill="#0090ff"/>
<g transform="translate(24,24)"><rect width="552" height="124" rx="12" class="panel line"/><circle cx="18" cy="16" r="4" fill="#ff5f57"/><circle cx="32" cy="16" r="4" fill="#febc2e"/><circle cx="46" cy="16" r="4" fill="#28c840"/><text x="64" y="20" class="mono subtle" font-size="10" letter-spacing="1.5">CONSOLE</text><line x1="0" y1="30" x2="552" y2="30" class="line"/><g class="in" style="animation-delay:0.20s"><text x="16" y="54" class="mono" font-size="12" fill="#e5484d">x</text><text x="32" y="54" class="mono fg" font-size="12">TypeError: cart.items is undefined</text></g><g class="in" style="animation-delay:0.45s"><text x="16" y="76" class="mono" font-size="12" fill="#e5484d">x</text><text x="32" y="76" class="mono fg" font-size="12">POST /api/checkout  500</text></g><g class="in" style="animation-delay:0.70s"><text x="16" y="98" class="mono" font-size="12" fill="#818b98">></text><text x="32" y="98" class="mono fg" font-size="12">selected: button.checkout</text></g><g class="in" style="animation-delay:1s"><rect x="384" y="82" width="152" height="30" rx="15" fill="#0090ff"/><text x="460" y="102" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Send to AI chat</text></g></g>
<text x="32" y="186" class="mono subtle" font-size="13" letter-spacing="1.5"><tspan fill="#0090ff" font-weight="700">04</tspan>   BROWSER EXTENSION</text><text x="568" y="186" text-anchor="end" class="mono subtle" font-size="13" letter-spacing="1.5">OPEN SOURCE  <tspan fill="#0090ff" font-size="16">&#8599;</tspan></text>
<text x="31" y="224" class="fg" font-size="30" font-weight="650" letter-spacing="-1">Context Grabber</text>
<text x="32" y="256" class="muted" font-size="16.5" >One-click bug reports for AI-built apps, sent</text>
<text x="32" y="280" class="muted" font-size="16.5" >straight into the chat that wrote the code.</text>
<text x="32" y="316" class="mono subtle" font-size="12.5" >WXT  /  Svelte 5  /  TypeScript  /  Tailwind</text>
</g>
</svg>
